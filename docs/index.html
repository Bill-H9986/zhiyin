<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载知音</title>
  <style>
    :root {
      --brand: linear-gradient(135deg, #7c3aed, #06b6d4);
      --text: #18181b;
      --muted: #71717a;
      --card: #ffffff;
      --border: #e5e5e5;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f5;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    main {
      width: min(520px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgb(0 0 0 / 8%);
    }

    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: var(--brand);
      color: #fff;
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 12px 0 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    a.button,
    button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 16px;
      padding: 18px 24px;
      background: var(--brand);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    a.button:hover,
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgb(124 58 237 / 25%);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .meta {
      margin-top: 20px;
      min-height: 44px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .notice {
      margin-top: 24px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
    }

    a.fallback {
      color: var(--danger);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">知</div>
    <h1>知音</h1>
    <p>AI 内容创作与多平台营销助手<br>下载安装后即可直接使用</p>

    <button id="download" type="button">下载知音</button>

    <div id="meta" class="meta">正在获取最新版本…</div>
    <div id="error" class="meta" role="alert" hidden></div>

    <div class="notice">
      安装包已包含本地运行所需组件。如 Windows 提示“已保护你的电脑”，请点击“更多信息”后选择“仍要运行”。
    </div>
  </main>

  <script>
    const button = document.getElementById('download')
    const meta = document.getElementById('meta')
    const error = document.getElementById('error')

    function resolveRepository() {
      const host = window.location.hostname
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0]
        const repo = window.location.pathname.split('/').filter(Boolean)[0]
        if (owner && repo) {
          return `${owner}/${repo}`
        }
      }
      return 'YOUR_GITHUB_USER/YOUR_REPO'
    }

    async function findLatestInstaller() {
      const repository = resolveRepository()
      const response = await fetch(`https://api.github.com/repos/${repository}/releases/latest`)
      if (!response.ok) {
        throw new Error(`release ${response.status}`)
      }
      const release = await response.json()
      const installer = release.assets.find(asset => /\.exe$/i.test(asset.name))
      if (!installer) {
        throw new Error('安装包尚未发布')
      }
      return {
        name: installer.name,
        size: installer.size,
        url: installer.browser_download_url,
      }
    }

    function formatSize(bytes) {
      if (!bytes) return ''
      return `${(bytes / 1024 / 1024).toFixed(0)} MB`
    }

    let repository

    async function download() {
      button.disabled = true
      meta.textContent = '正在准备下载，请稍候…'
      error.hidden = true
      error.textContent = ''
      try {
        repository = repository || resolveRepository()
        const installer = await findLatestInstaller()
        meta.textContent = `版本号：${installer.name} · 大小：${formatSize(installer.size)}`
        window.location.href = installer.url
      }
      catch (reason) {
        error.hidden = false
        const fallbackUrl = `https://github.com/${repository || resolveRepository()}/releases/latest`
        error.innerHTML = `暂时无法获取安装包，请稍后重试。<br>也可以：<a class="fallback" href="${fallbackUrl}" target="_blank" rel="noopener">前往 GitHub 最新发布页</a>`
        meta.textContent = ''
      }
      finally {
        button.disabled = false
      }
    }

    button.addEventListener('click', download)
    download()
  </script>
</body>
</html>
