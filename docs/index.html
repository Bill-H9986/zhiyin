<!doctype html>
<html lang="zh-CN" data-page-version="7">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="知音 AI 内容创作与多平台营销助手，下载安装后即可直接使用。">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <link rel="icon" type="image/svg+xml" href="./zhiyin-logo.svg">
  <title>知音 · AI 内容创作营销系统</title>
  <style>
    :root {
      --brand-purple: #8b7cf6;
      --brand-purple-light: #a78bfa;
      --brand-purple-lighter: #c4b5fd;
      --ink: #0a0a0a;
      --muted: #6b7280;
      --muted-light: #9ca3af;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { scroll-behavior: smooth; }

    body {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: 320px;
      pointer-events: none;
      background: linear-gradient(180deg, rgb(139 124 246 / 22%), rgb(139 124 246 / 8%) 62%, transparent);
    }

    .download-page {
      position: relative;
      z-index: 1;
      width: min(620px, calc(100% - 40px));
      padding: 54px 34px 48px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.2;
      letter-spacing: -0.025em;
      font-weight: 800;
    }

    .subtitle {
      max-width: 540px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted-light);
      font-size: 14px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 50px;
      margin-top: 30px;
      padding: 0 30px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(90deg, var(--brand-purple), var(--brand-purple-light));
      box-shadow: 0 14px 34px rgb(139 124 246 / 28%);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgb(139 124 246 / 34%);
    }
    .download-btn:disabled { opacity: .75; cursor: wait; }

    .status {
      min-height: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .note {
      margin: 5px 0 0;
      color: var(--muted-light);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .download-page { padding: 42px 22px 38px; }
      .logo { width: 72px; height: 72px; }
      .download-btn { width: min(100%, 320px); }
    }
  </style>
</head>
<body>
  <main class="download-page">
    <img class="logo" src="./zhiyin-logo.svg" alt="知音 Logo">
    <h1>知音 AI 内容营销系统</h1>
    <p class="subtitle">AI 驱动的全自动内容创作、多平台发布与 7×24 客户接待一站式平台</p>
    <p class="hint">面向零基础用户，一句话即可开始创作</p>
    <button class="download-btn" id="download" type="button">下载知音</button>
    <div class="status" id="meta" aria-live="polite">正在获取最新版本…</div>
    <p class="note">Windows 10 / 11 · 安装包已包含本地运行所需组件</p>
  </main>

  <script>
    const button = document.getElementById('download')
    const meta = document.getElementById('meta')

    function resolveRepository() {
      const host = window.location.hostname
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0]
        const repo = window.location.pathname.split('/').filter(Boolean)[0]
        if (owner && repo) return `${owner}/${repo}`
      }
      return 'Bill-H9986/zhiyin'
    }

    function formatSize(bytes) { return `${(bytes / 1024 / 1024).toFixed(0)} MB` }

    async function findLatestInstaller() {
      const response = await fetch(`https://api.github.com/repos/${resolveRepository()}/releases/latest`)
      if (!response.ok) throw new Error(`release ${response.status}`)
      const release = await response.json()
      return release.assets.find(asset => asset.name === 'zhiyin-latest.exe')
        || release.assets.find(asset => /\.exe$/i.test(asset.name))
    }

    async function loadStatus() {
      try {
        const installer = await findLatestInstaller()
        meta.textContent = `最新版本：${installer.name.replace(/\.exe$/, '')} · ${formatSize(installer.size)}`
      }
      catch {
        meta.textContent = '下载链接正在准备中，请稍后重试'
      }
    }

    async function download() {
      button.disabled = true
      meta.textContent = '正在准备下载…'
      try {
        const installer = await findLatestInstaller()
        window.location.href = installer.browser_download_url
      }
      catch {
        meta.textContent = '暂时无法获取安装包，请稍后重试'
      }
      finally {
        button.disabled = false
      }
    }

    button.addEventListener('click', download)
    loadStatus()
  </script>
</body>
</html>
